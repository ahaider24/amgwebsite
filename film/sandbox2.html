<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>inline film sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF8F2;--ink:#14110A;--ink-soft:#574F40;--accent:#FF4D1C;--display:"Fraunces",Georgia,serif;--sans:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;}
  *{box-sizing:border-box;margin:0} body{background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .filler{min-height:8vh;display:grid;place-items:center;text-align:center;padding:80px 24px;}
  .filler h2{font-family:var(--display);font-weight:450;font-size:clamp(30px,5vw,56px);max-width:18ch;line-height:1.05;}
  .filler em{font-style:italic;color:var(--accent);}
  .lead{min-height:8vh;display:grid;place-items:center;text-align:center;}
  .lead p{font-family:var(--display);font-style:italic;font-size:clamp(22px,2.8vw,34px);color:var(--ink);}
  .proof{min-height:120vh;background:var(--paper);display:grid;place-items:center;text-align:center;padding:80px 24px;}
  .proof h2{font-family:var(--display);font-weight:450;font-size:clamp(30px,4.4vw,54px);max-width:22ch;line-height:1.04;}
</style></head><body>
<section class="filler"><h2>The problem sections live up here. <em>You kept less.</em></h2></section>
<section class="lead"><p>Now see what the other side looks like.</p></section>

<section id="filmSection"></section>

<section class="proof"><h2>A Central Valley supplier, now the name the <em>AI hands over.</em></h2></section>

<script src="film-inline.js"></script>
<script>
  window.__ifilmForce = (location.search.match(/mode=(\w+)/)||[])[1];
  mountInlineFilm(document.getElementById('filmSection'), {
    accent:'#2596BE', diveScroll:1.7, crossfade:0.2,
    sections:[
      {id:'con',label:'Contractor',still:'con.jpg',clip:'vid/con.mp4',clipMobile:'vid/con-m.mp4',accent:'#2596BE',eyebrow:'Contractor',title:"You're not going to grow by renting out your time.",body:"Lunch on the tailgate while the quote sends itself and the week fills in. He hasn't picked up the phone since seven."},
      {id:'law',label:'Lawyer',still:'law.jpg',clip:'vid/law.mp4',clipMobile:'vid/law-m.mp4',accent:'#2596BE',eyebrow:'Lawyer',title:'For the owner whose number one value is freedom.',body:"Laptop closed at a decent hour, reading something that isn't a file. The new matters keep coming in without him."},
      {id:'cli',label:'Clinic',still:'cli.jpg',clip:'vid/cli.mp4',clipMobile:'vid/cli-m.mp4',accent:'#2596BE',eyebrow:'Clinic',title:'A calm mind, a packed calendar, a business you remember why you loved.',body:"A real lunch, stethoscope on the hook, the waiting room still full. She isn't the last one out anymore."},
      {id:'biz',label:'Business owner',still:'biz.jpg',clip:'vid/biz.mp4',clipMobile:'vid/biz-m.mp4',accent:'#2596BE',eyebrow:'Business owner',title:'Free time is what we actually sell.',body:"Chair turned to take his daughter's call while the floor keeps serving. Nobody needed him to say yes first."},
      {id:'fac',label:'Factory',still:'fac.jpg',clip:'vid/fac.mp4',clipMobile:'vid/fac-m.mp4',accent:'#2596BE',eyebrow:'Factory',title:'You built it to run without you.',body:"Coat on, one look back, the line still moving. He hasn't signed off on a run in months."}
    ]
  });
  // test hook: ?y=NNNN scrolls to that offset on load for headless screenshots
  addEventListener('load', function(){
    var m=location.search.match(/[?&]y=(\d+)/);
    if(m){ setTimeout(function(){ window.scrollTo(0, parseInt(m[1],10)); }, 500); }
  });
  // debug overlay
  var dbg=document.createElement('div');
  dbg.style.cssText='position:fixed;top:8px;left:8px;z-index:99999;background:#000;color:#0f0;font:13px/1.4 monospace;padding:8px;white-space:pre;';
  document.body.appendChild(dbg);
  function upd(){
    var sec=document.getElementById('filmSection');
    var scs=sec.querySelectorAll('.ifilm-scene');
    var pin=sec.querySelector('.ifilm-pin');
    var ops=[]; for(var i=0;i<scs.length;i++) ops.push((+getComputedStyle(scs[i]).opacity).toFixed(2));
    dbg.textContent='scrollY='+Math.round(scrollY)+' vh='+innerHeight+'\nsecTop='+Math.round(sec.getBoundingClientRect().top+scrollY)+' secH='+sec.offsetHeight+'\nscenes='+scs.length+' pinTop='+(pin?Math.round(pin.getBoundingClientRect().top):'?')+'\nsceneOps=['+ops.join(',')+']';
  }
  addEventListener('scroll',upd); setInterval(upd,150); setTimeout(upd,900);
</script>
</body></html>
